<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meezan Bank | Profile</title>
  <link rel="stylesheet" href="css/oj-alta.css">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/profile.css">
  <script src="js/libs/require/require.js"></script>
  <script src="js/libs/knockout/knockout.js"></script>
  <script src="js/libs/jquery/jquery-3.5.1.min.js"></script>
  <script src="js/libs/oj/v11.1.0/min/ojcore.js"></script>
  <script src="js/libs/oj/v11.1.0/min/ojknockout.js"></script>
  <script src="js/libs/oj/v11.1.0/min/ojbutton.js"></script>
  <script src="js/libs/oj/v11.1.0/min/ojinputtext.js"></script>
  <script src="js/libs/oj/v11.1.0/min/ojdialog.js"></script>
</head>
<body>
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <app-header></app-header>

  <!-- Main Content -->
  <div class="main-content">
    <div class="outer-frame">
      <h2>My Profile</h2>

      <!-- Top profile card -->
      <div class="profile-card" data-bind="visible: !isLoading()">
        <div class="profile-name" data-bind="text: fullName().toUpperCase()">LOADING...</div>
        <div class="account-title" data-bind="text: accountTitle">Account Title</div>

        <div class="info-row">
          <div class="info-values">
            <div class="info-columns">
              <div class="info-col">
                <div class="info-label">Filer Status:</div>
                <div class="info-value status-value" data-bind="text: filerStatus">-</div>
              </div>
              <div class="info-col">
                <div class="info-label">Zakat Deduction Status:</div>
                <div class="info-value status-value" data-bind="text: zakatStatus">-</div>
              </div>
              <div class="info-col cnic-expiry">
                <div class="info-label">CNIC Expiration Date:</div>
                <div class="info-value" data-bind="text: formattedCnicExpiry">-</div>
              </div>
              <div class="info-col cnic-col">
                <button class="update-cnic-btn">Update CNIC</button>
              </div>
            </div>
          </div>
        </div>
      </div>


      <!-- Details card -->
      <div class="profile-card1" data-bind="visible: !isLoading()">
        <div class="info-columns" style="grid-template-columns: 1fr 1fr; align-items:center;">
          <div class="info-col">
            <div class="info-label">Last Login Details</div>
            <div class="info-value">Sunday, 11 April 2021, 11:58 AM</div>
          </div>
          <div class="info-col">
            <div class="info-label">Date of Birth</div>
            <div class="info-value" data-bind="text: formattedDob">-</div>
          </div>
        </div>

        <div class="info-col" style="margin-top:10px;">
          <div class="info-label">Registered Home Address</div>
          <div class="info-value" data-bind="text: address">-</div>
        </div>

        <div class="contact-details">
          <div>
            <div class="info-label">Registered Contact Number</div>
            <div class="info-value" data-bind="text: phone">-</div>
          </div>
          <div>
            <div class="info-label">Registered Email Address</div>
            <div class="info-value" data-bind="text: email">-</div>
          </div>
          <div>
            <div class="info-label">Location</div>
            <div class="info-value" data-bind="text: formattedLocation">-</div>
          </div>
        </div>
      </div>

      <div class="btn-container">
        <oj-button class="back-btn" on-oj-action="[[goBack]]">Back</oj-button>
        <oj-button class="edit-btn" on-oj-action="[[goToEdit]]">Edit Personal Details</oj-button>
      </div>
    </div>
  </div>

</body>
</html>
