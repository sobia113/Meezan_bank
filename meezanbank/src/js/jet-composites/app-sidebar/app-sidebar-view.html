<link rel="stylesheet" href="css/app.css">
<div class="sidebar-backdrop" data-bind="click: toggleSidebar, css: { visible: isSidebarOpen }"></div>
<div class="sidebar" data-bind="css: { open: isSidebarOpen }">
  <!-- ko foreach: menuItems -->
  <div class="menu-item" 
       data-bind="click: $parent.handleMenuClick, 
                  css: { active: $parent.isActive(name) }">
    <img data-bind="attr: { src: icon }" width="28">
    <span data-bind="text: name"></span>
  </div>
  <!-- /ko -->
  
  <!-- Sidebar Footer -->

    <div class="sidebar-footer-item">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z'/%3E%3C/svg%3E" width="26">
